<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kinetiqo</title>

    <!-- Theme initialization & suppression: applies saved theme from localStorage or cookie immediately -->
    <script>
        (function() {
            function getTheme() {
                try {
                    var localTheme = localStorage.getItem('theme');
                    if (localTheme === 'dark' || localTheme === 'light') return localTheme;
                } catch(e) {}
                var cookies = document.cookie.split(';').map(function(c) { return c.trim().split('='); });
                var themeCookie = cookies.find(function(c) { return c[0] === 'theme'; });
                if (themeCookie && (themeCookie[1] === 'dark' || themeCookie[1] === 'light')) return themeCookie[1];
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
                return 'light';
            }
            var theme = getTheme();
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.write('<style>html.dark,html.dark body{background-color:#1a1a1a!important;color:#f5f5f5!important}</style>');
            } else {
                document.documentElement.classList.remove('dark');
                document.write('<style>html,body{background-color:#F9F9F8;color:#2C2A26}</style>');
            }
        })();
    </script>

    {% include "_shared_head_assets.html" %}
</head>
<body class="bg-warm-100 h-screen flex items-center justify-center p-4">
<script>if(document.documentElement.classList.contains('dark'))document.body.classList.add('dark');</script>

<div class="relative w-full max-w-md bg-white p-8 rounded-xl shadow-sm border border-gray-200">
    <!-- Theme Toggle at top-right of the login card -->
    <button id="theme-toggle" type="button"
            class="p-2 text-gray-400 hover:text-gray-600 rounded-lg transition"
            style="position: absolute; top: 1rem; right: 1rem; cursor: pointer;"
            title="Toggle theme"
            aria-label="Toggle theme">
        <svg id="theme-icon-sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
        <svg id="theme-icon-moon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
    </button>

    <div class="flex flex-col text-center justify-items-center items-center mb-8">
        <div class="flex justify-center items-center mb-2">
            <img src="{{ url_for('static', filename='img/kinetiqo_logo.png', v=app_version) }}"
                 alt="Kinetiqo Logo"
                 width="96"
                 height="96"/>
        </div>
        <h1 class="font-serif text-3xl font-bold text-gray-900">Kinetiqo</h1>
        <p class="text-gray-500 mt-2">Please sign in to access</p>
    </div>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded border border-red-200">
        {{ messages[0] }}
    </div>
    {% endif %}
    {% endwith %}

    <form method="POST" action="/login" class="space-y-4">
        <!-- CSRF hidden field for non-AJAX form submissions -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input id="username" type="text" name="username" required autocomplete="username"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition"
                   placeholder="login">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input id="password" type="password" name="password" required autocomplete="current-password"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition"
                   placeholder="password">
        </div>

        <div class="flex items-center pt-1">
            <label for="remember" class="flex items-center gap-2 cursor-pointer text-sm font-medium text-gray-700 select-none">
                <input id="remember" type="checkbox" name="remember" value="1"
                       class="w-4 h-4 rounded border-gray-300 text-orange-600 focus:ring-orange-500/20 cursor-pointer"
                       style="accent-color: #ea580c; cursor: pointer;"
                       aria-label="Remember me on this device">
                <span>Remember me</span>
            </label>
        </div>

        <button type="submit"
                class="w-full bg-gray-900 text-white py-2.5 rounded-lg font-medium hover:bg-gray-800 transition shadow-sm cursor-pointer">
            Sign In
        </button>
    </form>

    <p class="mt-6 text-center text-xs text-gray-400">
        Kinetiqo v.{{ app_version }} |
        <span style="display: inline-flex; align-items: center; gap: 4px; vertical-align: middle;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"
                     aria-label="GitHub" style="vertical-align: middle;">
                  <path class="github-logo" fill-rule="evenodd" clip-rule="evenodd"
                        d="M12 2C6.477 2 2 6.484 2 12.021c0 4.426 2.865 8.178 6.839 9.504.5.092.682-.217.682-.482 0-.237-.009-.868-.014-1.703-2.782.605-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.004.07 1.532 1.032 1.532 1.032.892 1.53 2.341 1.088 2.91.832.091-.647.35-1.088.636-1.339-2.221-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.987 1.029-2.687-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.025A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.295 2.748-1.025 2.748-1.025.546 1.378.202 2.397.1 2.65.64.7 1.028 1.594 1.028 2.687 0 3.847-2.337 4.695-4.566 4.944.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.749 0 .267.18.578.688.48C19.138 20.195 22 16.444 22 12.021 22 6.484 17.523 2 12 2z"/>
                </svg>
                <a href="https://github.com/lhotakj/kinetiqo" style="vertical-align: middle;"
                   title="Visit Github to see the source code" target="_blank" rel="noopener noreferrer">Github</a>
            </span>
        <br>
        &copy; 2026 Jaroslav Lhoták<br>
        <a href="mailto:jarda@lhotak.net">jarda@lhotak.net</a>
    </p>
</div>

<script>
    (function() {
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIconSun = document.getElementById('theme-icon-sun');
        const themeIconMoon = document.getElementById('theme-icon-moon');

        function updateThemeUI(isDark) {
            if (isDark) {
                if (themeIconSun) themeIconSun.classList.remove('hidden');
                if (themeIconMoon) themeIconMoon.classList.add('hidden');
                if (themeToggleBtn) {
                    themeToggleBtn.setAttribute('title', 'Switch to Light Mode');
                    themeToggleBtn.setAttribute('aria-label', 'Switch to Light Mode');
                }
            } else {
                if (themeIconSun) themeIconSun.classList.add('hidden');
                if (themeIconMoon) themeIconMoon.classList.remove('hidden');
                if (themeToggleBtn) {
                    themeToggleBtn.setAttribute('title', 'Switch to Dark Mode');
                    themeToggleBtn.setAttribute('aria-label', 'Switch to Dark Mode');
                }
            }
        }

        function setTheme(isDark) {
            var themeVal = isDark ? 'dark' : 'light';
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.body.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
                document.body.classList.remove('dark');
            }
            document.cookie = "theme=" + themeVal + "; path=/; max-age=31536000; SameSite=Lax";
            try { localStorage.setItem('theme', themeVal); } catch(e) {}
            updateThemeUI(isDark);
        }

        const initialDark = document.documentElement.classList.contains('dark');
        updateThemeUI(initialDark);

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', function() {
                const isCurrentlyDark = document.documentElement.classList.contains('dark');
                setTheme(!isCurrentlyDark);
            });
        }
    })();
</script>
</body>
</html>
