<div class="control-box-header" data-box-id="{{ box_id }}">
    <h4 class="text-gray-900 dark:text-gray-100">{{ box_title }}</h4>
    <button type="button"
        class="collapse-toggle-btn text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 p-0.5 focus:outline-none"
        aria-label="Toggle {{ box_title }} section">
        <svg class="chevron-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
    </button>
</div>
