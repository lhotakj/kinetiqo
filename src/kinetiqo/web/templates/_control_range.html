<div class="control-row">
    <label for="{{ control_id }}">{{ label }}</label>
    <input type="range" id="{{ control_id }}" min="{{ min_val|default(0) }}" max="{{ max_val|default(100) }}" value="{{ value|default(100) }}"
        class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
    <span id="{{ value_id|default(control_id ~ '-val') }}" class="text-xs w-8">{{ value|default(100) }}{{ suffix|default('%') }}</span>
</div>
