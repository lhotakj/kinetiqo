<div class="control-row">
    <label for="{{ control_id }}">{{ label|default('Color Tone') }}</label>
    <div class="flex items-center gap-1.5 flex-1">
        <input type="color" id="{{ control_id }}" value="{{ value|default('#ffffff') }}"
            class="h-8 w-12 p-0.5 rounded border border-gray-300 cursor-pointer dark:border-gray-600">
        <button type="button" id="{{ clear_btn_id }}"
            class="h-8 px-2.5 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-zinc-800 hover:bg-gray-50 dark:hover:bg-zinc-700 text-xs text-gray-600 dark:text-gray-300 transition"
            title="Clear color tone and restore default behavior">None</button>
        <span id="{{ value_id }}" class="text-xs text-gray-500 dark:text-gray-400">{{ value_text|default('None') }}</span>
    </div>
</div>
