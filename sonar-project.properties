# SonarQube project configuration for Kinetiqo
# See https://docs.sonarqube.org/latest/analysis/scan/sonarscanner/ for details
sonar.projectKey=kinetiqo
sonar.projectName=Kinetiqo
# sonar.projectVersion=1.0

# Source directories
sonar.sources=src

# Exclude web templates, static assets and third-party vendor files from static analysis
# Templates contain a mix of HTML and inline JS that generates many false positives for Sonar
sonar.exclusions=**/web/templates/**, **/web/static/**, **/static/**, **/build/**, **/docs/**

# Ignore the intentional local web-server bind in the Flask app entry point.
sonar.issue.ignore.multicriteria=webapp-bind
sonar.issue.ignore.multicriteria.webapp-bind.ruleKey=python:S8392
sonar.issue.ignore.multicriteria.webapp-bind.resourceKey=src/kinetiqo/web/app.py

# Encoding
# Sonar ignore for Dockerfile root user (cron requirement)
# Sonar ignore for Dockerfiles dependency-lock rule (accepted)
# Sonar ignore for Python cognitive complexity (S3776) across project
sonar.issue.ignore.multicriteria=docker-root,docker-root-2,docker-deps,docker-deps-2,python-complexity
sonar.issue.ignore.multicriteria.docker-root.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.docker-root.resourceKey=build/Dockerfile
sonar.issue.ignore.multicriteria.docker-root-2.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.docker-root-2.resourceKey=build/Dockerfile.local
sonar.issue.ignore.multicriteria.docker-deps.ruleKey=docker:S8544
sonar.issue.ignore.multicriteria.docker-deps.resourceKey=build/Dockerfile
sonar.issue.ignore.multicriteria.docker-deps-2.ruleKey=docker:S8544
sonar.issue.ignore.multicriteria.docker-deps-2.resourceKey=build/Dockerfile.local
sonar.issue.ignore.multicriteria.python-complexity.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.python-complexity.resourceKey=**/*.py
sonar.sourceEncoding=UTF-8
