name: Semgrep

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install --no-cache-dir semgrep==1.99.0

      - name: Run Semgrep
        run: semgrep scan --config p/default --error --metrics=off .
