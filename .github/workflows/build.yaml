name: Build and publish Docker image to DockerHub

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the Docker image to DockerHub'
        type: boolean
        default: true
      create_release:
        description: 'Create a GitHub Release'
        type: boolean
        default: false
      build_mcp:
        description: 'Build Kinetiqo + MCP Docker image (kinetiqo/web-mcp)'
        type: boolean
        default: true
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Determine build flags once so every subsequent step can reference them
      # cleanly.  Handles both workflow_dispatch and commit-message triggers.
      # -----------------------------------------------------------------------
      - name: Determine build flags
        id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_RELEASE: ${{ inputs.create_release }}
          INPUT_BUILD_MCP: ${{ inputs.build_mcp }}
        run: |
          EVENT="$EVENT_NAME"
          MSG="$HEAD_COMMIT_MSG"

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            PROCEED=true
            PUBLISH="$INPUT_PUBLISH"
            RELEASE="$INPUT_RELEASE"
            BUILD_MCP="$INPUT_BUILD_MCP"
          else
            # push to main: driven by commit message keywords
            if echo "$MSG" | grep -qE '/(release|publish)'; then
              PROCEED=true
            else
              PROCEED=false
            fi
            echo "$MSG" | grep -q '/publish' && PUBLISH=true || PUBLISH=false
            echo "$MSG" | grep -q '/release' && RELEASE=true  || RELEASE=false
            BUILD_MCP=true
          fi

          echo "proceed=$PROCEED"    >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH"    >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE"    >> "$GITHUB_OUTPUT"
          echo "build_mcp=$BUILD_MCP" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.flags.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: Set up QEMU (required for linux/arm64 cross-compilation)
        if: steps.flags.outputs.proceed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.flags.outputs.proceed == 'true'
        uses: docker/setup-buildx-action@v3.12.0

      - name: Log in to Docker Hub
        if: steps.flags.outputs.proceed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The build script pulls kinetiqo/firebird-python:3.14 from DockerHub as
      # its base image (no Firebird compilation here — that lives in the
      # separate "Build Firebird Python Base Image" workflow).
      # build.sh builds both images:
      #   1. Standalone Kinetiqo (web + cron): kinetiqo/web:latest
      #   2. Kinetiqo + FastMCP: kinetiqo/web-mcp:latest
      - name: Build and publish Kinetiqo Docker images (Standalone & MCP)
        if: steps.flags.outputs.proceed == 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          BUILD_MCP: ${{ steps.flags.outputs.build_mcp }}
          PUBLISH: ${{ steps.flags.outputs.publish }}
        run: |
          chmod +x build/build.sh
          PUSH_FLAG=""
          if [[ "$PUBLISH" == "true" ]]; then
            PUSH_FLAG="--push"
          fi

          if [[ "$BUILD_MCP" == "true" ]]; then
            ./build/build.sh web mcp $PUSH_FLAG
          else
            ./build/build.sh web $PUSH_FLAG
          fi

      - name: Get versions from build
        if: steps.flags.outputs.proceed == 'true'
        id: get_version
        run: |
          VERSION=$(cat ./src/version.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          SHORT_VERSION=$(cat ./src/short_version.txt)
          echo "short_version=$SHORT_VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        if: steps.flags.outputs.proceed == 'true'
        id: changelog
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          IS_PUBLISH: ${{ steps.flags.outputs.publish }}
          IS_MCP: ${{ steps.flags.outputs.build_mcp }}
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });

            const lastTag = releases.length ? releases[0].tag_name : '';
            let commits;

            if (lastTag) {
              const comparison = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: lastTag,
                head: context.sha
              });
              commits = comparison.data.commits;
            } else {
              const allCommits = await github.rest.repos.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              commits = allCommits.data;
            }

            const changelog = commits
              .map(c => `- ${c.commit.message.split('\n')[0]}`)
              .join('\n');

            const isPublish = process.env.IS_PUBLISH === 'true';
            const isMcp = process.env.IS_MCP === 'true';
            const version = process.env.VERSION || '';
            let dockerLink = '';
            if (isPublish && version) {
              dockerLink = `\n\n### Published Docker Images\n- **Kinetiqo (Standalone Web + Cron)**: [\`kinetiqo/web:${version}\`](https://hub.docker.com/r/kinetiqo/web/tags?name=${version})`;
              if (isMcp) {
                dockerLink += `\n- **Kinetiqo + MCP (Web + Cron + FastMCP SSE)**: [\`kinetiqo/web-mcp:${version}\`](https://hub.docker.com/r/kinetiqo/web-mcp/tags?name=${version}) / [\`kinetiqo/web-mcp:latest\`](https://hub.docker.com/r/kinetiqo/web-mcp/tags?name=latest)`;
              }
            }

            const fullChangelog = changelog + dockerLink;

            require('fs').writeFileSync('CHANGELOG.md', fullChangelog);

            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, `changelog<<EOF\n${fullChangelog}\nEOF\n`);

      - name: Upload changelog as artifact
        if: steps.flags.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

      - name: Create GitHub Release
        if: steps.flags.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false

      - name: Add build summary
        if: steps.flags.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          PUBLISH: ${{ steps.flags.outputs.publish }}
          RELEASE: ${{ steps.flags.outputs.release }}
          BUILD_MCP: ${{ steps.flags.outputs.build_mcp }}
        run: |
          echo "### ✅ Build complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`$VERSION\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Published | \`$PUBLISH\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release created | \`$RELEASE\` |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PUBLISH" == "true" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### Published Docker Images" >> "$GITHUB_STEP_SUMMARY"
            echo "- **App**: [kinetiqo/web:$VERSION](https://hub.docker.com/r/kinetiqo/web/tags?name=$VERSION)" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$BUILD_MCP" == "true" ]]; then
              echo "- **Kinetiqo + MCP**: [kinetiqo/web-mcp:$VERSION](https://hub.docker.com/r/kinetiqo/web-mcp/tags?name=$VERSION) / [kinetiqo/web-mcp:latest](https://hub.docker.com/r/kinetiqo/web-mcp/tags?name=latest)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
