name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Make syntax script executable
        run: chmod +x development/syntax-check.sh
        shell: bash

      - name: Run syntax check
        run: development/syntax-check.sh
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --only-binary :all: pip
          pip install --only-binary :all: -r requirements.txt -r requirements-dev.txt
        shell: bash

      - name: Make tests script executable
        run: chmod +x development/run-unit-tests.sh
        shell: bash

      - name: Run unit tests with coverage
        run: development/run-unit-tests.sh
        shell: bash

      - name: SonarQube / SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

