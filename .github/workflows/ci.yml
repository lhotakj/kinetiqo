name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Make syntax script executable
        run: chmod +x development/syntax-check.sh
        shell: bash

      - name: Run syntax check
        run: development/syntax-check.sh
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
        shell: bash

      - name: Make tests script executable
        run: chmod +x development/run-unit-tests.sh
        shell: bash

      - name: Run unit tests
        run: development/run-unit-tests.sh
        shell: bash
